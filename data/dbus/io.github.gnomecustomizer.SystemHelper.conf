<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root"><allow own="io.github.gnomecustomizer.SystemHelper"/></policy>
  <policy context="default">
    <allow send_destination="io.github.gnomecustomizer.SystemHelper"/>
    <allow receive_sender="io.github.gnomecustomizer.SystemHelper"/>
  </policy>
</busconfig>
